<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3e2"/>
      <stop offset="50%" stop-color="#fde8c8"/>
      <stop offset="100%" stop-color="#f5d5a0"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#6B4F12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg1)"/>
  <!-- Window light rays -->
  <polygon points="900,0 1200,0 1200,400 700,600" fill="#fff8e1" opacity="0.4"/>
  <polygon points="950,0 1100,0 1200,200 800,600" fill="#fff8e1" opacity="0.2"/>
  <!-- Desk -->
  <rect x="200" y="320" width="800" height="20" rx="4" fill="url(#desk)"/>
  <rect x="250" y="340" width="10" height="180" fill="#5a3e0e"/>
  <rect x="940" y="340" width="10" height="180" fill="#5a3e0e"/>
  <!-- Laptop -->
  <rect x="350" y="250" width="180" height="120" rx="8" fill="#333" stroke="#555" stroke-width="2"/>
  <rect x="360" y="258" width="160" height="96" rx="2" fill="#1a5276"/>
  <rect x="320" y="320" width="240" height="8" rx="4" fill="#444"/>
  <!-- Coffee -->
  <ellipse cx="620" cy="295" rx="25" ry="8" fill="#4a2c0a"/>
  <rect x="595" y="275" width="50" height="20" rx="3" fill="#6b3a0a"/>
  <ellipse cx="620" cy="275" rx="25" ry="8" fill="#8B4513"/>
  <ellipse cx="620" cy="275" rx="20" ry="6" fill="#d4a574"/>
  <!-- Papers -->
  <rect x="680" y="270" width="100" height="60" rx="2" fill="white" transform="rotate(-5 730 300)" opacity="0.9"/>
  <rect x="700" y="275" width="90" height="55" rx="2" fill="white" transform="rotate(3 745 300)" opacity="0.95"/>
  <line x1="710" y1="285" x2="775" y2="285" stroke="#ccc" stroke-width="1"/>
  <line x1="710" y1="295" x2="760" y2="295" stroke="#ccc" stroke-width="1"/>
  <line x1="710" y1="305" x2="770" y2="305" stroke="#ccc" stroke-width="1"/>
  <!-- Person silhouette -->
  <circle cx="500" cy="180" r="35" fill="#4a3728"/>
  <rect x="460" y="215" width="80" height="110" rx="15" fill="#d4a024"/>
  <rect x="470" y="220" width="60" height="40" rx="8" fill="#f5f0e5"/>
  <!-- Plant -->
  <rect x="150" y="260" width="30" height="70" rx="5" fill="#8B4513"/>
  <circle cx="165" cy="240" r="30" fill="#2d7d46"/>
  <circle cx="145" cy="250" r="20" fill="#3a9d5b"/>
  <circle cx="180" cy="235" r="22" fill="#34a853"/>
  <!-- Warm light overlay -->
  <rect width="1200" height="600" fill="#f5a623" opacity="0.05"/>
</svg>