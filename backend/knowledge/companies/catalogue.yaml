# Campus recruiter catalogue
#
# The companies that run large fresher hiring drives on Indian engineering
# campuses, with what each one actually tests.
#
# ─── READ THIS BEFORE EDITING ────────────────────────────────────────────────
#
# Eligibility rules and drive windows CHANGE EVERY YEAR. The values here are the
# pattern that has held across recent cycles, not a guarantee for any particular
# batch, and the API labels them as indicative for exactly that reason. Never let
# the UI present them as the official criteria — a candidate who skips a drive
# because our page said "60% required" when the notification said 65% has been
# actively harmed by this file.
#
# `verified` is the date a human last checked the entry against the company's own
# notification or a first-party source. An entry more than a cycle old should be
# re-checked rather than trusted.
#
# topic weights are percentages of the technical assessment, and must sum to 100
# per company — there is a test asserting this, because a silently unbalanced set
# produces a roadmap that quietly under-weights something important.

verified: 2026-07-30

companies:
  # ─── Mass recruiters — the volume hirers ──────────────────────────────────
  - slug: tcs
    name: TCS
    short: Tata Consultancy Services
    tier: mass_recruiter
    hires_per_year: "~40,000 freshers"
    drive_window: "Aug – Dec (NQT runs multiple cycles a year)"
    eligibility: "60% throughout X / XII / UG, no active backlogs, gap ≤ 24 months"
    business_context: "India's largest IT services firm. Signature products: TCS BaNCS (core banking, used by banks worldwide) and ignio (AIOps automation). Heaviest verticals are BFSI and retail. Interviews lean on fundamentals and scale, and a BFSI framing (\"a payments table with millions of rows\") is common."
    accent: "#0f4c9e"
    programs:
      - name: Ninja
        detail: "The standard offer. Fundamentals-first technical round plus managerial and HR."
      - name: Digital
        detail: "Higher package. Deeper DSA, DBMS design and a system-design conversation."
      - name: Prime
        detail: "Top band. Advanced DSA and CS depth; invitation is score-gated."
    rounds:
      - "NQT — aptitude, reasoning, verbal, programming logic"
      - "Technical interview"
      - "Managerial round"
      - "HR round"
    topics:
      - { name: "Aptitude & Reasoning", weight: 25 }
      - { name: "C / Java / Python fundamentals", weight: 20 }
      - { name: "Data Structures", weight: 15 }
      - { name: "DBMS & SQL", weight: 15 }
      - { name: "OOP Concepts", weight: 10 }
      - { name: "Operating Systems & Networks", weight: 10 }
      - { name: "Project & HR", weight: 5 }

  - slug: cognizant
    name: Cognizant
    short: Cognizant Technology Solutions
    tier: mass_recruiter
    hires_per_year: "~25,000 freshers"
    drive_window: "Sep – Feb (Digital Nurture)"
    eligibility: "60% throughout, no active backlogs at the time of joining"
    business_context: "Healthcare and life sciences is its single largest vertical — it owns TriZetto, which powers claims and benefits administration for US health insurers. BFSI is second. A healthcare-data or claims-processing framing is very characteristic of a Cognizant question."
    accent: "#1a7bc4"
    programs:
      - name: GenC
        detail: "Core offer. Aptitude, fundamentals, OOP, DBMS and a project discussion."
      - name: GenC Next
        detail: "Higher band. DSA-heavy assessment plus full-stack and design depth."
      - name: GenC Pro
        detail: "Specialist track for niche skills; usually a separate assessment."
      - name: Digital Nurture — Java FSE
        detail: "Full-stack Java track: Spring Boot, REST, SQL and a project deep-dive."
    rounds:
      - "Aptitude assessment"
      - "Automata / coding round"
      - "Technical interview"
      - "HR round"
    topics:
      - { name: "OOP Concepts", weight: 20 }
      - { name: "Java / Programming", weight: 20 }
      - { name: "Data Structures & Algorithms", weight: 15 }
      - { name: "DBMS & SQL", weight: 15 }
      - { name: "Aptitude", weight: 15 }
      - { name: "Operating Systems", weight: 8 }
      - { name: "Project & HR", weight: 7 }

