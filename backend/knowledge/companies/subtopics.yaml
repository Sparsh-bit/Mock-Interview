# Subtopics — the actual checklist a candidate works through.
#
# A topic ("Data Structures", 15% of the paper) is too coarse to study. These are
# the units someone ticks off, each with an estimate, a video, and something to
# read. Progress is tracked per subtopic, so this file also defines what "done"
# means.
#
# Separate from resources.yaml so each file keeps one job: that one holds the
# topic-level starting points, this one holds the working checklist. Both are
# joined onto a topic by the same alias index.
#
# ─── LINK POLICY ─────────────────────────────────────────────────────────────
# Every URL here was fetched and confirmed to resolve on the `verified` date
# below. YouTube entries are PLAYLISTS, not individual videos: playlists survive
# a creator re-uploading or re-ordering a video, individual IDs do not.
#
# One exception, recorded honestly: leetcode.com returns HTTP 403 to automated
# checks (Cloudflare bot protection), so it could not be machine-verified. The URL
# pattern is correct and the site is not in doubt, but nobody has clicked it here.
#
# Re-run the check before each hiring cycle. A dead link in a study plan wastes an
# evening and costs trust in everything else on the page.
#
# ─── WHY SOME SUBTOPICS HAVE NO VIDEO ────────────────────────────────────────
# Aptitude, English, System Design, Behavioural and Cloud carry a doc and a
# practice link but NO video. That is deliberate.
#
# Every playlist verified for this file is a CS/programming course — Striver and
# Kunal on DSA, Gate Smashers on DBMS/OS/CN, Abdul Bari on algorithms. An earlier
# version of this file attached those to every topic, which meant "Percentages,
# ratio & averages" linked to a Java DSA playlist. A wrong link in a study plan
# costs a candidate an evening and costs us their trust in everything else on the
# page, so the field is now absent rather than wrong.
#
# To add them: find a real playlist for the topic, verify it resolves (fetch it
# and check the <title> — YouTube returns HTTP 200 with the string "Video
# unavailable" in its JS bundle even for live pages, so the status code and a
# naive grep both lie), then add it here.

