questions:
  - id: java-core-001
    content: "What is the difference between == and .equals() in Java?"
    topic: "java-fundamentals"
    difficulty: easy
    type: conceptual
    expected_keywords:
      - "reference comparison"
      - "value comparison"
      - "String pool"
      - "object identity"
      - "override equals"
    ideal_answer: >
      == compares object references (memory addresses) for objects, and compares values for primitives.
      .equals() compares the logical content of objects. For String, .equals() compares the actual
      character sequence. If you do not override .equals() in your class, it defaults to ==.
      String literals use the String pool, so s1 == s2 may be true for literals but not for
      new String() objects.
    follow_ups:
      - id: java-core-001-f1
        content: "If you override equals(), what else must you always override and why?"
        trigger: incomplete_answer
      - id: java-core-001-f2
