- company_slug: tcs
  company_name: TCS
  program_slug: ninja
  program_name: Ninja (NQT)
  sources:
    - https://gdpi.hitbullseye.com/tcs-ninja-interview-questions.php
    - https://prepinsta.com/interview-preparation/tcs-ninja-interview-experience/
    - https://www.edureka.co/blog/interview-questions/tcs-interview-questions/
  rounds:
    - name: NQT Online Test
      duration_minutes: 90
      description: Numerical, verbal and reasoning ability plus a programming section.
    - name: Technical Interview
      duration_minutes: 25
      description: >-
        Short and fundamentals-heavy. Basic programming, OOP, DBMS and the
        candidate's project. Often merged with the HR round on the same day.
    - name: Managerial / HR Round
      duration_minutes: 20
      description: >-
        Relocation, night shifts, academic gaps and backlogs, family background
        and service-agreement willingness.
  focus_topics:
    - OOP concepts
    - C and C++ fundamentals
    - Java basics
    - Data structures
    - DBMS and SQL
    - Project discussion
  tips:
    - The Ninja technical round is short (20-30 minutes) and stays on fundamentals — depth matters less than crisp, confident definitions.
    - TCS asks about academic dips, backlogs and gaps directly. Have a calm, honest answer ready.
    - Relocation and night-shift willingness are asked in almost every reported interview.
    - Non-CSE candidates get core-branch questions too, plus "why are you switching to IT?".
