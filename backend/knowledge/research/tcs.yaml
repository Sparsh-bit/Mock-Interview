- company_slug: tcs
  company_name: TCS
  program_slug: digital
  program_name: Digital
  sources:
    - https://www.edureka.co/blog/interview-questions/tcs-interview-questions/
    - https://talentbattle.in/tcs/interview-questions
  rounds:
    - name: NQT Advanced Test
      duration_minutes: 90
      description: Advanced aptitude plus an advanced coding section.
    - name: Technical Interview
      duration_minutes: 65
      description: >-
        Substantially deeper than Ninja — DSA with complexity discussion,
        DBMS design, OS internals and real project architecture. Can run past
        90 minutes.
    - name: Managerial / HR Round
      duration_minutes: 20
      description: Motivation, relocation, and long-term career intent.
  focus_topics:
    - Data structures and algorithms
    - Java and OOP
    - DBMS and SQL
    - Operating systems
    - System design basics
    - Project discussion
  tips:
    - TCS Digital runs 60-90 minutes versus Ninja's 20-30 — expect follow-ups that keep drilling until you reach your limit.
    - Be ready to state time and space complexity for every solution you give.
    - Your project is treated as real engineering work: expect design trade-off questions, not just a description.
  previous_questions:
    - question: What is the time and space complexity of your solution, and can you do better?
      topic: Data structures and algorithms
      round: Technical Interview
      difficulty: medium
      kind: scenario
    - question: Differentiate between an abstract class and an interface, and say when you would use each.
      topic: Java and OOP
      round: Technical Interview
      difficulty: medium
      kind: conceptual
    - question: Explain the four pillars of OOP with examples from your own code.
      topic: Java and OOP
      round: Technical Interview
      difficulty: medium
      kind: scenario
    - question: What do you mean by joins in SQL? Explain outer join with an example.
      topic: DBMS and SQL
      round: Technical Interview
      difficulty: medium
      kind: conceptual
    - question: Design the database schema for the project you just described.
      topic: DBMS and SQL
      round: Technical Interview
      difficulty: hard
      kind: scenario
    - question: What is normalization, and to which normal form did you take your schema?
      topic: DBMS and SQL
      round: Technical Interview
      difficulty: hard
      kind: conceptual
    - question: What is a deadlock, and how would you prevent one?
      topic: Operating systems
      round: Technical Interview
      difficulty: hard
      kind: conceptual
    - question: What is the difference between a process and a thread?
      topic: Operating systems
      round: Technical Interview
      difficulty: medium
      kind: conceptual
    - question: How would you scale the system you built to ten times the traffic?
      topic: System design basics
      round: Technical Interview
      difficulty: hard
      kind: scenario
    - question: Which design decision in your project would you change today, and why?
      topic: Project discussion
      round: Technical Interview
      difficulty: hard
      kind: scenario
