- company_slug: cognizant
  company_name: Cognizant
  program_slug: genc-next
  program_name: GenC Next
  sources:
    - https://www.interviewbit.com/genc-interview-questions/
    - https://www.fita.in/cognizant-recruitment-process/
  rounds:
    - name: Technical Skill Assessment
      duration_minutes: 180
      description: >-
        Three sections — 30 MCQs (OOP, OS, DBMS, Java, HTML/CSS); 4 DSA coding
        questions (dynamic programming, greedy, graphs, trees); 2 SQL questions
        on an ER diagram using joins and nested queries.
    - name: Technical Interview
      duration_minutes: 50
      description: >-
        Deeper than GenC — full-stack reasoning, DSA follow-ups and design
        discussion on top of core fundamentals.
    - name: HR Round
      duration_minutes: 15
      description: Motivation, relocation and document verification.
  focus_topics:
    - Java and OOP
    - Data structures and algorithms
    - DBMS and SQL
    - Web and full-stack basics
    - Operating systems
    - System design basics
    - Project discussion
  tips:
    - GenC Next is the highest package tier, so the DSA bar is genuinely higher — dynamic programming, graphs and trees all appear.
    - The assessment includes HTML/CSS, so don't neglect the front-end half of full-stack.
    - Expect SQL against an ER diagram, not just definitions — practise joins and nested queries.
  previous_questions:
    - question: Serialize a binary tree into a string, and deserialize it back.
      topic: Data structures and algorithms
      round: Technical Interview
      difficulty: hard
      kind: coding
    - question: How many distinct ways are there to climb n stairs?
