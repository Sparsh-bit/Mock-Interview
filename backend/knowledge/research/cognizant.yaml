# Cognizant interview research — cached so we never pay for a live web search
# during an interview. Refresh by editing this file and re-running:
#   uv run python scripts/seed_research.py
#
# Researched: 2026-07-28
# Sources are recorded per-entry so a stale row can be re-verified rather than
# guessed at.

- company_slug: cognizant
  company_name: Cognizant
  program_slug: genc
  program_name: GenC
  sources:
    - https://www.interviewbit.com/genc-interview-questions/
    - https://prepinsta.com/cognizant/genc-technical-interview-questions/
    - https://unstop.com/blog/cognizant-genc-interview-questions
  rounds:
    - name: Aptitude Assessment
      duration_minutes: 90
      description: Quantitative aptitude, logical reasoning and verbal ability.
    - name: Technical Interview
      duration_minutes: 40
      description: >-
        Programming fundamentals, OOP, DBMS and the candidate's own project.
        Expect to write code on paper or a shared editor.
    - name: HR Round
      duration_minutes: 15
      description: Motivation, relocation, background and document verification.
  focus_topics:
    - OOP concepts
    - DBMS and SQL
    - Data structures
    - Operating systems
    - Programming fundamentals (C/C++/Java)
    - SDLC
    - Project discussion
  tips:
    - Be ready to write code by hand — Fibonacci, sorting and string reversal come up repeatedly.
    - Know your own project deeply; every reported interview drills into it.
    - Definition-style questions are common, so crisp one-line answers score well.
