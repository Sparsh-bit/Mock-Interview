      difficulty: medium
      kind: coding
    - question: Rotate a matrix by 90 degrees in place.
      topic: Data structures and algorithms
      round: Technical Skill Assessment
      difficulty: medium
      kind: coding
    - question: Transpose a matrix.
      topic: Data structures and algorithms
