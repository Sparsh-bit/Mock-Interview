[project]
name = "hotseat-backend"
version = "0.1.0"
description = "Hotseat — mock interviews that sound like the real panel"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.40",
    "alembic>=1.15.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    # Pydantic / Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "email-validator>=2.2.0",
    # Auth (Supabase JWT verification)
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    # Redis
    "redis[asyncio]>=5.2.0",
    # AI Provider
    "zhipuai>=2.1.5",
    "anthropic>=0.69.0",
    # Logging
    "structlog>=24.4.0",
    "rich>=13.7.0",
    # File handling
    "python-docx>=1.1.2",
    # Storage (Supabase)
    "supabase>=2.10.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0",
    "anyio>=4.4.0",
    "sniffio>=1.3.1",
    "pypdf>=5.1.0",
    # Error tracking. Optional at runtime: nothing initialises unless SENTRY_DSN is set
    # (see app/core/observability.py), so the dependency being present costs nothing.
    "sentry-sdk[fastapi]>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.1",
    "faker>=30.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "PIE", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy relationship() targets are cross-file string forward-refs resolved
# at mapper-configuration time, not import time — ruff can't see them, so F821
# here is a false positive rather than a real undefined-name bug.
"app/models/*.py" = ["F821"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
# Required for pydantic models. Without it mypy reports every `Settings()` call as
# missing its required fields, because it cannot see that pydantic-settings
# populates them from the environment.
plugins = ["pydantic.mypy"]
