version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: interviewos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: interviewos_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewos -d interviewos_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Self-hosted Piston — sandboxed code execution for the coding round.
  # Language runtimes (java/python/c++/sqlite) are installed after first start
  # via: backend/scripts/install_piston_runtimes.sh
  piston:
    image: ghcr.io/engineer-man/piston:latest
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_data:/piston
    tmpfs:
      - /tmp:exec

volumes:
  postgres_data:
  redis_data:
  piston_data:
