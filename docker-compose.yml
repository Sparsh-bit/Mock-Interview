# Local development infrastructure.
#
# Every port here is bound to 127.0.0.1 rather than the default 0.0.0.0. Docker's
# default publishes a container port on ALL interfaces, which put this Postgres and
# an unauthenticated Redis on the local network — reachable by anything on the same
# café or hostel wi-fi. Binding to loopback keeps them reachable from this machine
# only, which is all local development needs.
#
# These services are development-only. Production uses Supabase Postgres and a
# managed Redis, neither of which is exposed by this file.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: interviewos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: interviewos_dev
    ports:
      # Loopback only — see the note at the top of this file.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewos -d interviewos_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Loopback only. Redis has no password and its default config trusts every
      # client, so publishing it on 0.0.0.0 is the single most dangerous line this
      # file could contain.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Self-hosted Piston — sandboxed code execution for the coding round.
  # Language runtimes (java/python/c++/sqlite) are installed after first start
  # via: backend/scripts/install_piston_runtimes.sh
  piston:
    image: ghcr.io/engineer-man/piston:latest
    privileged: true
    ports:
      # Loopback only, and note `privileged: true` below: this container runs
      # untrusted candidate code by design, so it must never be reachable off-box.
      - "127.0.0.1:2000:2000"
    volumes:
      - piston_data:/piston
    tmpfs:
      - /tmp:exec

volumes:
  postgres_data:
  redis_data:
  piston_data:
